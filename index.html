<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CKT Global Webstore</title>

<!-- PWA: manifest & warna tema -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F5257">

<!-- PWA: sokongan iOS/Safari "Add to Home Screen" -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CKT Global">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- PWA: ikon am -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1784810000">
</head>
<body>
<div id="app">

  <div class="app-header">
    <div class="topbar">
      <div class="store-name"><img class="store-logo" id="storeLogoImg" src="" alt="Logo" style="display:none;"><span id="storeNameDisplay">Kedai Saya</span></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="cartBtn">🛒<span class="cart-badge" id="cartBadge" style="display:none;">0</span></button>
      </div>
    </div>

    <div class="category-bar" id="categoryBar"></div>

    <div class="search-wrap">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari produk...">
        <button type="button" class="search-clear-btn" id="searchClearBtn" style="display:none;">✕</button>
      </div>
    </div>

    <div class="promo-video-wrap" id="promoVideoWrap"></div>
  </div>

  <div class="catalog-scroll" id="catalogScroll">
    <div class="catalog" id="catalogView"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" data-nav="store"><span class="ic">🏬</span>Kedai</button>
    <button class="nav-item" data-nav="cart"><span class="ic">🛒</span>Troli</button>
    <button class="nav-item" data-nav="track"><span class="ic">📦</span>Jejak</button>
  </div>

  <!-- Product Detail Panel -->
  <div class="panel" id="detailPanel">
    <div class="panel-header"><button class="back-btn" data-close="detailPanel">←</button><h2 id="detailPanelTitle">Produk</h2></div>
    <div class="panel-body" id="detailBody"></div>
  </div>

  <!-- Cart Panel -->
  <div class="panel" id="cartPanel">
    <div class="panel-header"><button class="back-btn" data-close="cartPanel">←</button><h2>Troli Anda</h2></div>
    <div class="panel-body" id="cartBody"></div>
  </div>

  <!-- Checkout Panel -->
  <div class="panel" id="checkoutPanel">
    <div class="panel-header"><button class="back-btn" data-close="checkoutPanel">←</button><h2>Checkout</h2></div>
    <div class="panel-body" id="checkoutBody"></div>
  </div>

  <!-- Order confirmation panel -->
  <div class="panel" id="confirmPanel">
    <div class="panel-header"><button class="back-btn" data-close="confirmPanel">←</button><h2>Pesanan Dihantar</h2></div>
    <div class="panel-body" id="confirmBody"></div>
  </div>

  <!-- Track Order Panel -->
  <div class="panel" id="trackPanel">
    <div class="panel-header"><button class="back-btn" data-close="trackPanel">←</button><h2>Jejak Pesanan</h2></div>
    <div class="panel-body" id="trackBody"></div>
  </div>

  <!-- Admin Panel -->
  <div class="panel" id="adminPanel">
    <div class="panel-header"><button class="back-btn" data-close="adminPanel">←</button><h2>Login</h2><div id="adminHeaderActions" style="margin-left:auto;"></div></div>
    <div class="panel-body" id="adminBody"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=1784810000"></script>
<script src="js/app.js?v=1784810000"></script>
<script>
  // Daftar service worker untuk PWA (Add to Home Screen)
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW register failed:', err));
    });
  }
</script>
</body>
</html>
